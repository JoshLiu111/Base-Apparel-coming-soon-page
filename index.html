<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Base Apparel coming soon page</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <img src="./images/logo.svg" alt="Base Apparel" width="158" height="33">
    </header>

    <picture class="hero">
      <source media="(min-width: 60em)" srcset="./images/hero-desktop.jpg">
      <img src="./images/hero-mobile.jpg" alt="Model wearing an orange shirt from the upcoming collection" width="375" height="250">
    </picture>

    <main class="content">
      <h1><span class="light">We're</span> coming soon</h1>
      <p class="intro">
        Hello fellow shoppers! We're currently building our new fashion store.
        Add your email below to stay up-to-date with announcements and our launch deals.
      </p>

      <form class="notify" id="notify-form" novalidate>
        <div class="field">
          <label class="sr-only" for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="Email Address"
                 autocomplete="email" aria-describedby="email-error">
          <img class="error-icon" src="./images/icon-error.svg" alt="" width="24" height="24">
          <button class="submit" type="submit" aria-label="Subscribe">
            <img src="./images/icon-arrow.svg" alt="" width="12" height="20">
          </button>
        </div>
        <p class="error-msg" id="email-error" role="alert" hidden></p>
        <p class="success-msg" id="email-success" role="status" hidden></p>
      </form>
    </main>
  </div>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Josh</a>.
  </footer>
</body>
</html>
